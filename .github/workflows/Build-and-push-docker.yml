name: Build and Push Docker Image

on:
  push:
    branches: ["swift"]
    tags: ["code/v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: webdav-knowledge-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # The chart runs the image named after pyproject.toml's version: a release
      # tag that disagrees would publish an image no chart asks for.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/code/v')
        run: deploy/check-version "${GITHUB_REF_NAME#code/v}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags keep the semver contract (code/v0.4.0 -> v0.4.0); pushes to
      # swift publish swift-dev, which never collides with a release.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/(v.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dummy # only the version is wanted
          tags: |
            type=match,pattern=code/(v.*),group=1

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            # image:
            ```
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
