name: Build and Push Docker Image

on:
  push:
    branches: ["swift"]
    tags: ["code/v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: webdav-knowledge-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # deploy/values.yaml names the image by pyproject.toml's version: a release
      # tag that disagrees would publish an image no deployment asks for.
      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/code/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#code/v}"
          PROJECT_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          VALUES_TAG="$(sed -n 's/^  tag: "\([^"]*\)"/\1/p' deploy/values.yaml | head -n 1)"
          test "$TAG_VERSION" = "$PROJECT_VERSION" && test "$TAG_VERSION" = "$VALUES_TAG" || {
            echo "Tag $TAG_VERSION, pyproject.toml $PROJECT_VERSION, deploy/values.yaml $VALUES_TAG must agree" >&2
            exit 1
          }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags publish the bare version (code/v0.4.0 -> 0.4.0); pushes to
      # swift publish dev tags that never collide with a release.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/v(.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev
            type=sha,enable=${{ github.ref == 'refs/heads/swift' }},prefix=swift-dev-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - name: Extract the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#code/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            # Deploy with Fred's generic knowledge-base chart and this release's deploy/values.yaml
            helm show readme oci://ghcr.io/thalesgroup/fred-helm/knowledge-base
            ```
          draft: false
          prerelease: false
