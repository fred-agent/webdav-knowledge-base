# =============================================================================
# The WebDAV Knowledge Base's values for Fred's generic knowledge-base chart: what
# any deployment of this pod starts from. A deployment adds its own values file
# (addresses, the client secret, image tag); deploy/k3d/values.yaml is the local one.
#
#   helm install knowledge-base-webdav oci://ghcr.io/thalesgroup/fred-helm/knowledge-base \
#     --version <fred chart version> -f deploy/values.yaml -f my-values.yaml
#
# The chart's README (helm show readme) lists what each deployment must set.
# =============================================================================

# This release of the pod; a deployment names its own registry and tag.
image:
  repository: ghcr.io/fred-agent/webdav-knowledge-base
  tag: "0.4.0"

# The pod's configuration (fred-sdk's PodConfiguration plus this pod's own
# `webdav:` section, which the chart passes through). Keep the key names aligned
# with the Fred pod configuration models.
configuration:
  # This pod's identity in metrics and logs (`service` label and log field).
  # One per deployment: give a second deployment its own slug.
  app:
    runtime_id: webdav-kb
  knowledge_base:
    prefix: fred.webdav
    control_plane_url: http://control-plane-backend:8222/control-plane/v1
    knowledge_flow_url: http://knowledge-flow-backend:8000/knowledge-flow/v1
  security:
    m2m:
      enabled: true
      realm_url: http://keycloak.infra.svc.cluster.local/realms/app
      client_id: kb-fred.webdav
      secret_env_var: FRED_KB_CLIENT_SECRET # pragma: allowlist secret (environment variable name)
  scheduler:
    temporal:
      host: temporal-frontend.infra.svc.cluster.local:7233
      namespace: default
  # Read-only Prometheus endpoints served by the `run` worker (fred-sdk >= the
  # release carrying Knowledge Base metrics; older SDKs ignore this block).
  # Bound to all interfaces so the metrics Service below can reach them.
  observability:
    kpi:
      # fred_kb_* series: runs, items, issues, calls to Fred, ingestion waits.
      prometheus:
        enabled: true
        address: 0.0.0.0
        port: 9000
    temporal:
      # temporal_* series from the workflow engine: polls, task latencies, slots.
      prometheus:
        enabled: true
        address: 0.0.0.0
        port: 9001

# The client secret, from a Secret the deployment owns (here `knowledge-base-m2m`,
# key `client-secret`). To trust a private CA for the WebDAV server, add to this
# list (a list replaces, so restate the secret) and mount the PEM:
#
#   extraEnvVars:
#     - { name: FRED_KB_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: knowledge-base-m2m, key: client-secret } } }
#     - { name: WEBDAV_KB_CA_FILE, value: /etc/ssl/private-ca/corporate-root.pem }
#   extraVolumes:
#     - { name: webdav-ca, configMap: { name: corporate-root-ca } }
#   extraVolumeMounts:
#     - { name: webdav-ca, mountPath: /etc/ssl/private-ca, readOnly: true }
extraEnvVars:
  - name: FRED_KB_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: knowledge-base-m2m, key: client-secret } # pragma: allowlist secret (Secret reference)
